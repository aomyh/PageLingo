<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>PageLingo · 手动翻译</title>
    <link rel="stylesheet" href="translate.css">
    <script type="module" src="translate.js"></script>
  </head>
  <body>
    <main class="translator">
      <header class="window-header">
        <div class="brand"><img src="assets/logo.svg" width="29" height="29" alt=""><span>PageLingo<span class="brand-dot">.</span></span></div>
        <button id="manual-close" class="icon-button close-button" type="button" aria-label="关闭翻译窗口" title="关闭翻译窗口"><svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg></button>
      </header>
      <div class="heading"><h1>想读懂的，放在这里<span>。</span></h1><p>手动输入或粘贴，继续读懂世界。</p></div>
      <p class="preview-note" id="manual-preview" hidden>界面预览 · 加载 Chrome 扩展后即可翻译，不会发送当前内容。</p>
      <section class="configuration" aria-label="翻译配置">
        <button id="manual-settings" class="provider-button" type="button" title="配置 AI 服务商"><span class="provider-dot" aria-hidden="true"></span><span class="provider-copy"><strong id="manual-provider">读取配置中…</strong><span id="manual-model"></span></span><span class="provider-arrow" aria-hidden="true">↗</span></button>
        <div class="language-field"><label for="manual-language">翻译为</label><select id="manual-language" aria-label="手动翻译目标语言"></select></div>
      </section>
      <section class="text-panel input-panel" aria-labelledby="manual-input-label">
        <div class="panel-heading"><label id="manual-input-label" for="manual-input">原文 <span>自动识别语言</span></label><div class="input-tools"><span id="manual-count" aria-live="polite" aria-atomic="true">0 / 5,000</span><button id="manual-clear" class="text-button" type="button" disabled>清空</button></div></div>
        <textarea id="manual-input" dir="auto" placeholder="输入或粘贴需要翻译的内容…" aria-describedby="manual-count" spellcheck="false" autocomplete="off"></textarea>
      </section>
      <div class="translation-actions"><button id="manual-translate" class="translate-button" type="button" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M3 5h11M8 3v2m-3 0c.5 4 3 7 7 9M12 5c-.7 5-4 8-9 10m10 5 4-10 4 10m-6.5-4h5"/></svg><span>翻译文本</span><span class="shortcut" aria-hidden="true">⌘ / Ctrl ↵</span></button><button id="manual-cancel" class="cancel-button" type="button" hidden>停止翻译</button></div>
      <section class="text-panel result-panel" aria-labelledby="manual-output-label">
        <div class="panel-heading"><h2 id="manual-output-label">译文 <span id="manual-result-note"></span></h2><button id="manual-copy" class="text-button copy-button" type="button" disabled><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 3.5v-1A1 1 0 0 0 9.5 1.5h-7a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h1"/></svg><span>复制</span></button></div>
        <div id="manual-output" class="translation-output" tabindex="0" dir="auto" aria-busy="false" data-empty="true">译文会显示在这里</div>
      </section>
      <div class="window-footer"><p id="manual-status" role="status" aria-live="polite" aria-atomic="true">文字直达当前 AI 服务，输入不会保存为草稿。</p><span class="window-hint">拖动窗口标题栏可移动 · 点击外部不会关闭</span></div>
    </main>
  </body>
</html>
