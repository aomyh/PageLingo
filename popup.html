<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>PageLingo · 网页翻译</title>
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <main class="popup">
      <header class="brand-row">
        <a class="brand" href="options.html" target="_blank" aria-label="打开 PageLingo 配置">
          <img src="assets/logo.svg" alt="" width="34" height="34" />
          <span>PageLingo<span class="brand-dot">.</span></span>
        </a>
        <span class="edition">AI TRANSLATOR</span>
      </header>

      <section class="intro">
        <span class="eyebrow">YOUR WORLD, TRANSLATED</span>
        <h1>阅读，没有语言边界<span>。</span></h1>
        <p>用你喜欢的 AI，读懂当前网页。</p>
      </section>

      <section class="provider-card" aria-label="当前翻译服务">
        <div id="provider-mark" class="provider-mark" aria-hidden="true">D</div>
        <div class="provider-copy">
          <div class="provider-heading"><strong id="provider-name">加载中</strong><span id="connection-state" class="connection-state">检查配置</span></div>
          <span id="provider-model" class="provider-model">正在读取设置…</span>
        </div>
        <button class="icon-button" id="provider-settings" type="button" title="配置翻译服务" aria-label="配置翻译服务">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m9 5 7 7-7 7" /></svg>
        </button>
      </section>

      <div id="setup-notice" class="setup-notice" hidden>
        <span>添加一个 API Key，即可开始翻译。</span>
        <button id="setup-button" type="button">去配置 <span aria-hidden="true">↗</span></button>
      </div>

      <section class="preferences" aria-label="翻译偏好">
        <div class="field-row">
          <label for="target-language">翻译为</label>
          <div class="select-wrap">
            <select id="target-language" aria-label="目标语言"></select>
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m4 6 4 4 4-4" /></svg>
          </div>
        </div>
        <div class="field-row mode-row">
          <span id="mode-label">阅读模式</span>
          <div class="segmented" role="group" aria-labelledby="mode-label">
            <button id="mode-bilingual" type="button" data-mode="bilingual" aria-pressed="true">双语对照</button>
            <button id="mode-translated" type="button" data-mode="translated" aria-pressed="false">只看译文</button>
          </div>
        </div>
        <div class="selection-row">
          <div class="selection-copy">
            <label for="selection-enabled">划词翻译 <span id="selection-state" role="status" aria-live="polite" aria-atomic="true">已关闭</span></label>
            <p id="selection-hint">选中文字即可翻译</p>
          </div>
          <label class="selection-switch">
            <input id="selection-enabled" type="checkbox" role="switch" aria-label="划词翻译" aria-describedby="selection-hint" disabled>
            <span aria-hidden="true"></span>
          </label>
        </div>
      </section>

      <section class="actions" aria-label="页面操作">
        <button id="translate-button" class="translate-button" type="button" disabled>
          <svg class="translate-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 5h11M9 3v2m-3 0c.5 4 3 7 7 9M13 5c-.7 5-4 8-9 10m10 5 4-10 4 10m-6.5-4h5" /></svg>
          <span id="translate-label">翻译当前页面</span>
          <svg class="action-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6" /></svg>
        </button>
        <div class="secondary-actions">
        <button id="restore-button" class="restore-button" type="button" disabled>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 10h5V5M3.7 10A8 8 0 1 1 5 18" /></svg>
          恢复原文
        </button>
        <button id="open-manual" class="manual-link" type="button" title="在当前网页打开可拖动的翻译浮窗，点击外部不会关闭">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 8h10m-5 0v8m-3 0h6"/></svg>
          手动翻译 <span aria-hidden="true">↗</span>
        </button>
        </div>
        <div id="progress-panel" class="progress-panel" hidden>
          <div class="progress-copy"><span id="progress-text">正在翻译…</span><span id="progress-count"></span></div>
          <div id="progress-bar" class="progress-track" role="progressbar" aria-label="翻译进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress-fill"></div></div>
          <span id="cache-note" class="cache-note"></span>
        </div>
        <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
      </section>

      <footer>
        <button id="open-usage" class="usage-shortcut" type="button" aria-label="查看今日用量统计"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2 13V9m4 4V5m4 8V2m4 11V7"/></svg><span id="usage-summary" aria-live="polite">今日用量 · 加载中</span></button>
        <button id="open-options" class="options-link" type="button">配置与服务商 <span aria-hidden="true">↗</span></button>
      </footer>
    </main>
  </body>
</html>
